  <circle cx="186" cy="117" r="7" fill="#34D399"/>

  <text x="132" y="178" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#93C5FD">$ ssh_exec.py gpu-node</text>
  <text x="132" y="216" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#E2E8F0">status: online</text>
