<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Remote Server Manager</title>
  <desc id="desc">A polished banner showing a terminal connected over SSH to remote server nodes.</desc>

  <rect width="1280" height="420" fill="#0F172A"/>
  <rect x="56" y="48" width="1168" height="324" rx="28" fill="#111827" stroke="#273449" stroke-width="2"/>

